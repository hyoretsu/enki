name: Apply pending migrations
description: >
  Install deps and apply pending Prisma Next migrations with `migrate`. In check mode the
  target is a disposable shadow database seeded from production (so the run proves the
  pending migrations apply cleanly on top of real prod data); otherwise it deploys to the
  target database. The shadow/prod DB is already initialized & signed, so `migrate` advances
  it — never `db init`, which would baseline a fresh DB and skip the existing-data check.

inputs:
  check:
    description: When true, verify migrations against the seeded shadow DB and allow Turbo to cache the result; when false, force a real deploy.
    default: "false"
  database-url:
    description: Connection string for the target migration database.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      run: bun install

    - name: Apply migrations
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: bun turbo -F sql migrate:deploy ${{ inputs.check == 'true' && '' || '--force' }}
