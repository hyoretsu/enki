name: CI

on:
  pull_request:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ github.base_ref == 'main' || github.base_ref == 'staging' }}
      tasks: ${{ steps.affected.outputs.tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Need the base commit present to diff the PR against it.
          fetch-depth: 0

      - name: Compute affected packages
        id: affected
        uses: ./.github/actions/detect-affected
        with:
          tasks: check-types build test:unit test:e2e migrate:deploy
          base-sha: ${{ github.event.pull_request.base.sha }}

  build:
    name: "${{ matrix.package }} / Build"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['build'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: ./.github/actions/build
        with:
          package: ${{ matrix.package }}

  check-types:
    name: "${{ matrix.package }} / Type-check"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check types
        uses: ./.github/actions/check-types
        with:
          package: ${{ matrix.package }}

  migrate_check:
    name: "${{ matrix.package }} / Migrate check"
    needs: detect
    if: needs.detect.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    services:
      # Disposable shadow DB. Seeded from production below so the migration check runs
      # against real prod data — the whole point is to catch migrations that would break
      # existing rows, not just verify they apply on an empty schema.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enki_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['migrate:deploy'] }}
    env:
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enki_shadow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Copy production (schema + data + prisma-next signature) into the shadow DB so the
      # migration runs against a faithful prod replica. pg_dump's plain SQL is piped
      # straight into the shadow; ON_ERROR_STOP makes any restore error fail the job.
      - name: Seed shadow DB from production
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --no-owner --no-privileges --clean --if-exists "$PROD_DATABASE_URL" \
            | psql --variable=ON_ERROR_STOP=1 "$SHADOW_DATABASE_URL"

      - name: Check safety of new migrations
        uses: ./.github/actions/migrate-db
        with:
          check: "true"
          database-url: ${{ env.SHADOW_DATABASE_URL }}

  test_e2e:
    name: "${{ matrix.package }} / E2E tests"
    needs: detect
    if: needs.detect.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['test:e2e'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run E2E tests
        uses: ./.github/actions/test-e2e
        with:
          package: ${{ matrix.package }}
          # Disposable Postgres service (above) — no external secret needed.
          database-url: postgresql://postgres:postgres@localhost:5432/enki_test

  test_unit:
    name: "${{ matrix.package }} / Unit tests"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['test:unit'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run unit tests
        uses: ./.github/actions/test-unit
        with:
          package: ${{ matrix.package }}
